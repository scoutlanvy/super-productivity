<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      /* Standalone native document: mirror app spacing tokens and use OS colors. */
      :root {
        color-scheme: light dark;
        --s: 8px;
        --s2: 16px;
        --font-size-md: 14px;
        --font-size-2xl: 22px;
        --card-bg: Canvas;
        --text-color: CanvasText;
      }
      body {
        margin: 0;
        font: menu;
        font-size: var(--font-size-md);
        background: var(--card-bg);
        color: var(--text-color);
      }
      form {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 0;
        flex: 1;
        font: inherit;
        font-size: var(--font-size-2xl);
        padding: var(--s2);
        border: 0;
        background: var(--card-bg);
        color: var(--text-color);
      }
      footer {
        display: flex;
        justify-content: space-between;
        padding: var(--s) var(--s2);
      }
    </style>
  </head>
  <body>
    <form>
      <input
        autofocus
        required
        autocomplete="off"
      />
      <footer><span>Enter ↵ · Esc</span><span role="alert"></span></footer>
    </form>
    <script src="quick-add-task-renderer.js"></script>
  </body>
</html>
